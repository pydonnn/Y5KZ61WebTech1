<!DOCTYPE html>
<html lang="hu">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Textdekor</title>
        <style>
            body {
                background-color: #0E9873;
            }

            #para1 {
                text-align: left;
                color: rgb(217, 255, 0);
                font-size: 18pt;
                text-align: justify;
            }

            a:link {
                color: red;
            }

            a:visited {
                color: rgb(38, 37, 37);
            }

            a:hover {
                color: orange;
            }

            a:active {
                color: red;
            }
        </style>
    </head>
    <body>
    <h1>CSS - text-decoration</h1>

    <div style="width: 600px;">

    <p id="para1"><a href="https://uni-miskolc.hu" target="_blank">Kattints ide az <i>uni-miskolc.hu</i> weblap megnyitásához!</a></p>
    
    <p>Egy piros pontozott vonallal aláhúzott szöveg.</p>
    </div>
    </body>
</html>
