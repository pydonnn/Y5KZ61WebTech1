<!DOCTYPE html>
<html lang="hu">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>jQuery feladatok</title>
        <script src="jquery-4.1.0.js"></script>
        <script>
            $(document).ready(function() {
                
                $("#p1").click(function() {
                    $(this).hide();
                });
    
                $("#p2").dblclick(function() {
                    $(this).hide();
                });
    
                $("gomb").mouseenter(function() {
                    alert('A gomb fölé húzva az egeret.');
                });
    
                $("h2").mouseleave(function() {
                    alert('Elhúzta az egeret a fejlécről');
                });
    
                $("form").mousedown(function() {
                    $(this).css("border", "10px", "#333399 solid");
                });
    
                $("form").mouseup(function() {
                    $(this).css("border", "10px", "#333399 solid");
                });

                $("#nev,#email,#jelszo").focus(function() {
                    $(this).css("background-color","#FF99FF");
                });

                $("#nev,#email,#jelszo").blur(function() {
                    $(this).css("background-color","#FF99FF");
                });
            })
        </script>
    </head>
    
    <body>
        <h2>jQuery feladatok</h2>

        <p id="p1">A jQuery egy JavaScript programozói könyvtár, amelyet John Resig kezdett fejleszteni. <strong>Kattints ide</strong>, és eltűnik!</p>
        <p id="p2">Elterjedtnek tekinthető, segítségével könnyen bejárható egy HTML oldal DOM-ja. <strong>Kattints ide duplán</strong>, és eltűniki</p>

        <br>

        <form style="padding:10px; width:500px">
            
            <b>Név:</b> <input name="nev" id="nev"><br><br>
            <b>E-mail:</b> <input name="email" id="email"><br><br>
            <b>Jelszó:</b> <input  type="password" name="jelszo" id="jelszo"><br><br><br>

            <input type="button" id="gomb" value="Jelentkezés">
        </form>
    </body>
</html>
