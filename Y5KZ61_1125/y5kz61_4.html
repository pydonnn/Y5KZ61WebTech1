<!DOCTYPE html>
<html lang="hu">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>jQuery feladatok</title>
        <script src="jquery-4.1.0.js"></script>
        <script>
            $(document).ready(function() {

                $("#gomb1").click(function() {
                    $("p").fadeOut(5000)
                });

                $("#gomb2").click(function() {
                    $("p").fadeIn(5000)
                });

                $("#gomb3").click(function() {
                    $("p").fadeToggle(2000)
                });

                $("#gomb4").click(function() {
                    $("form").fadeTo(2000,0.1)
                });

                $("#gomb5").click(function() {
                    $("form").fadeTo(2000,0.5)
                });

                $("#gomb6").click(function() {
                    $("form").fadeTo(2000,0.8)
                });
                
                $("#gomb7").click(function() {
                    $("form").slideUp(3000)
                });

                $("#gomb8").click(function() {
                    $("form").slideDown(3000)
                });

                $("#gomb9").click(function() {
                    $("form").slideToggle(1000)
                });
            })
        </script>
    </head>
    
    <body>
        <h2>jQuery feladatok</h2>

        <p id="p1" style="font-size: 14pt;">A jQuery egy JavaScript programozói könyvtár, amelyet John Resig kezdett fejleszteni. <strong>Kattints ide</strong>, és eltűnik!</p>
        <p id="p2">Elterjedtnek tekinthető, segítségével könnyen bejárható egy HTML oldal DOM-ja. <strong>Kattints ide duplán</strong>, és eltűniki</p>

        <button id="gomb1" type="button"><strong>Elrejt</strong></button>
        &nbsp;&nbsp;&nbsp;
        <button id="gomb2" type="button"><strong>Megjelenít</strong></button>
        &nbsp;&nbsp;&nbsp;
        <button id="gomb3" type="button"><strong>Ki/Bekapcsol</strong></button>

        <br><br>

        <form style="padding:20px; width:300px; background: #AFCFF5;">
            
            <b>Név:</b> <input name="nev" id="nev"><br><br>
            <b>E-mail:</b> <input name="email" id="email"><br><br>
            <b>Jelszó:</b> <input  type="password" name="jelszo" id="jelszo"><br><br><br>

            <input type="button" id="gomb" value="Jelentkezés">

        </form>

        <br>

        <button id="gomb4" type="button"><strong>Áttetszőség = 0.1</strong></button>
        &nbsp;&nbsp;&nbsp;
        <button id="gomb5" type="button"><strong>Áttetszőség = 0.5</strong></button>
        &nbsp;&nbsp;&nbsp;
        <button id="gomb6" type="button"><strong>Áttetszőség = 0.8</strong></button>
        
        <br><br>

        <button id="gomb7" type="button"><strong>Elrejt</strong></button>
        &nbsp;&nbsp;&nbsp;
        <button id="gomb8" type="button"><strong>Megjelenít</strong></button>
        &nbsp;&nbsp;&nbsp;
        <button id="gomb9" type="button"><strong>Ki/Bekapcsol</strong></button>

    </body>
</html>
