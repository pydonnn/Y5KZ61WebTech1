<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border</title>
    <style>

        body {
            background-color: #0E9873;
            font-family: 'Courier New', Courier, monospace;
        }

        p {
            border: 3px solid #FF0099;
            color: red;
            font-size: 1.4em;
        }
    </style>
</head>
<body>
    <h1>Ez egy címsor</h1>

    <div style="width: 250px;">
        <p>Egy piros bekezdés</p>

        <p>Egy piros bekezdés</p>

        <p>Egy piros bekezdés</p>
    </div>
</body>
</html>
